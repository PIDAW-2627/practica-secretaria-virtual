events {}

http {
    server_tokens off;

    upstream api {
        # "api" es el nombre del servicio en compose.yaml; el DNS de Docker lo resuelve
        server api:3000;
    }

    server {
        listen 80;
        client_max_body_size 10m;   # la API limita las entregas a 5 MB

        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
